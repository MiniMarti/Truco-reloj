<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pantalla de Bloqueo</title>
  
  <!-- Configuración para guardar como app en iOS (pantalla completa sin interfaz de Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background-color: #000;
      /* Sustituye la URL por el fondo de pantalla de tu iPhone */
      background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top, 40px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      overflow: hidden;
    }

    /* Barra de estado superior */
    .status-bar {
      width: 100%;
      padding: 0 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }

    /* Reloj y Fecha estilo iOS */
    .lock-screen-clock {
      text-align: center;
      margin-top: 20px;
      z-index: 10;
    }

    .date {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.2px;
      margin-bottom: 5px;
      text-transform: capitalize;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .time {
      font-size: 84px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
      transition: color 0.3s ease;
    }

    /* Punto invisible para activar el truco */
    #secret-trigger {
      position: absolute;
      top: 0;
      right: 0;
      width: 100px;
      height: 100px;
      z-index: 999;
      background: transparent; /* Totalmente transparente */
    }

    /* Indicador inferior de desbloqueo */
    .home-indicator {
      width: 135px;
      height: 5px;
      background-color: #ffffff;
      border-radius: 3px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Barra superior (Simulada) -->
  <div class="status-bar">
    <span id="small-time">--:--</span>
    <div>
      <span>5G</span>
      <span style="margin-left: 5px;">100%</span>
    </div>
  </div>

  <!-- Reloj Principal -->
  <div class="lock-screen-clock">
    <div class="date" id="date">Cargando...</div>
    <div class="time" id="clock">00:00</div>
  </div>

  <!-- Borde inferior para deslizar -->
  <div class="home-indicator"></div>

  <!-- ZONA INVISIBLE DE ACTIVACIÓN (Esquina superior derecha) -->
  <div id="secret-trigger"></div>

  <script>
    // Estado del truco: true = hora sumada (+1h), false = hora real
    let isShifted = true;

    function updateClock() {
      const now = new Date();
      
      // Si el truco está activo, sumamos 1 hora a la fecha actual
      if (isShifted) {
        now.setHours(now.getHours() + 1);
      }

      // Formatear Hora y Minutos
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeString = `${hours}:${minutes}`;

      // Formatear Fecha (ej. Jueves, 13 de agosto)
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const dateString = now.toLocaleDateString('es-ES', options);

      // Actualizar elementos en pantalla
      document.getElementById('clock').textContent = timeString;
      document.getElementById('small-time').textContent = timeString;
      document.getElementById('date').textContent = dateString;
    }

    // Al tocar la zona invisible superior derecha, cambiamos el estado
    document.getElementById('secret-trigger').addEventListener('click', () => {
      isShifted = !isShifted; // Alterna entre +1 hora y hora real
      updateClock();

      // Pequeña vibración háptica de confirmación si el dispositivo lo soporta
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
    });

    // Actualizar reloj cada segundo
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
