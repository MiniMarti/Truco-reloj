<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lock Screen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            /* Enlace a tu fondo de pantalla */
            --bg-image: url('https://i.ibb.co/XrRm33zJ/f74620f4-d57a-4286-9a2c-9a4f4d2f8e13.jpg'); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* --- CONTENEDOR DEL RELOJ Y FECHA --- */
        .lock-screen-header {
            position: absolute;
            top: env(safe-area-inset-top, 50px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        /* Fecha (Estilo "Jue 13 ago") */
        .date {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.2px;
            margin-bottom: 5px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
        }

        /* Reloj ALARGADO + EFECTO CRISTAL / TRANSLÚCIDO (iOS 17 Glass Style) */
        .time {
            font-size: 110px;
            font-weight: 100;
            /* Estira el texto verticalmente para imitar la fuente alta de iOS 17 */
            transform: scaleY(1.45) scaleX(0.85);
            transform-origin: top center;
            letter-spacing: -2px;
            line-height: 0.9;
            margin-top: 10px;
            margin-bottom: 35px;

            /* Transparencia con borde translúcido para el efecto cristal */
            color: rgba(255, 255, 255, 0.2);
            -webkit-text-stroke: 1.8px rgba(255, 255, 255, 0.6);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2), 0 2px 8px rgba(0,0,0,0.4);
        }

        /* BOTONES INFERIORES (LINTERNA Y CÁMARA) */
        .bottom-actions {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 20px) + 25px);
            width: 100%;
            padding: 0 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Punto invisible para activar el truco (Esquina superior derecha) */
        #secret-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 110px;
            height: 90px;
            z-index: 999;
            background: transparent;
        }

        /* Línea inferior de inicio */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- Zona invisible superior derecha para activar el truco -->
    <div id="secret-trigger"></div>

    <!-- Reloj y Fecha -->
    <div class="lock-screen-header">
        <div class="date" id="date">Jue 13 ago</div>
        <div class="time" id="clock">7:36</div>
    </div>

    <!-- Botones estilo iOS abajo -->
    <div class="bottom-actions">
        <!-- Linterna -->
        <div class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M6 2h12v3l-4 4v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9L6 5V2zm4 8v3h4v-3h-4z"/>
            </svg>
        </div>
        <!-- Cámara -->
        <div class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
            </svg>
        </div>
    </div>

    <!-- Indicador de barra de inicio -->
    <div class="home-indicator"></div>

    <script>
        // Estado del truco: true = +1 hora, false = hora real
        let isShifted = true;

        function updateClock() {
            const now = new Date();
            
            if (isShifted) {
                now.setHours(now.getHours() + 1);
            }

            // Hora sin ceros iniciales
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Fecha abreviada de iOS: "Jue 13 ago"
            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const monthNames = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            
            const dayName = dayNames[now.getDay()];
            const dayNum = now.getDate();
            const monthName = monthNames[now.getMonth()];

            document.getElementById('date').textContent = `${dayName} ${dayNum} ${monthName}`;
        }

        // Tocar arriba a la derecha cambia la hora al instante
        document.getElementById('secret-trigger').addEventListener('click', () => {
            isShifted = !isShifted;
            updateClock();

            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
