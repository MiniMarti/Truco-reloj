<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lock Screen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            /* Tu imagen limpia de ImgBB */
            --bg-image: url('https://i.ibb.co/KcMYM1B1/image.jpg'); 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #000000;
            background-image: var(--bg-image);
            
            /* Encuadre exacto igual a tu captura */
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
            
            height: 50vh;
            width: 50vw;
            overflow: hidden;
            position: relative;
        }

        /* --- CONTENEDOR DE RELOJ Y FECHA --- */
        .lock-screen-header {
            position: absolute;
            top: env(safe-area-inset-top, 50px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        /* Fecha dinámina abreviada */
        .date {
            font-size: 21px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 2px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        /* RELOJ ALARGADO CRISTAL TRANSLÚCIDO (Proporción exacta iOS 17) */
        .time {
            font-size: 155px;
            font-weight: 100;
            display: inline-block;
            /* Proporción de estiramiento vertical exacta de tu captura */
            transform: scale(0.68, 1.85);
            transform-origin: top center;
            letter-spacing: -6px;
            line-height: 0.78;
            margin-top: 15px;
            margin-bottom: 60px;

            /* Efecto cristal en 3 capas */
            color: rgba(255, 255, 255, 0.12) !important;
            -webkit-text-stroke: 2.2px rgba(255, 255, 255, 0.55);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.4);
        }

        /* Botones de acción inferiores */
        .bottom-actions {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 15px) + 22px);
            width: 100%;
            padding: 0 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        /* Zona secreta para el truco (Esquina superior derecha) */
        #secret-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 100px;
            z-index: 999;
            background: transparent;
        }

        /* Barra inferior */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div id="secret-trigger"></div>

    <div class="lock-screen-header">
        <div class="date" id="date"></div>
        <div class="time" id="clock"></div>
    </div>

    <div class="bottom-actions">
        <div class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M6 2h12v3l-4 4v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9L6 5V2zm4 8v3h4v-3h-4z"/>
            </svg>
        </div>
        <div class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
            </svg>
        </div>
    </div>

    <div class="home-indicator"></div>

    <script>
        let isShifted = true;

        function updateClock() {
            const now = new Date();
            
            if (isShifted) {
                now.setHours(now.getHours() + 1);
            }

            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Fecha dinámica real que cambia sola cada día
            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const monthNames = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            
            const dayName = dayNames[now.getDay()];
            const dayNum = now.getDate();
            const monthName = monthNames[now.getMonth()];

            document.getElementById('date').textContent = `${dayName} ${dayNum} ${monthName}`;
        }

        // Tocar esquina superior derecha alterna el truco
        document.getElementById('secret-trigger').addEventListener('click', () => {
            isShifted = !isShifted;
            updateClock();

            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
