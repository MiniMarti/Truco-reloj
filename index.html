<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lock Screen</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
        }

        body {
            position: relative;
        }

        /* --- CONTENEDOR DE RELOJ Y FECHA --- */
        .lock-screen-header {
            position: absolute;
            top: env(safe-area-inset-top, 50px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 10;
        }

        /* Fecha dinámica */
        .date {
            font-size: 21px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }

        /* RELOJ CON PROPORCIÓN NATURAL (Sin escalado ni deformación) */
        .time {
            font-size: 96px;
            font-weight: 700;
            display: inline-block;
            letter-spacing: -2px;
            line-height: 1;
            margin-top: 5px;
            margin-bottom: 20px;

            /* Blanco sólido */
            color: #ffffff !important;
            -webkit-text-stroke: 0;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* BOTONES INFERIORES ESTILO APPLE */
        .bottom-actions {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 15px) + 22px);
            width: 100%;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.55);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4), inset 0 0.5px 0.5px rgba(255, 255, 255, 0.4);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        .action-btn svg {
            width: 23px;
            height: 23px;
            fill: #ffffff;
        }

        /* Zona secreta superior derecha para cambiar la hora (+1h / real) */
        #secret-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 100px;
            z-index: 999;
            background: transparent;
        }

        /* Barra de inicio de iOS */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 135px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div id="secret-trigger"></div>

    <div class="lock-screen-header">
        <div class="date" id="date"></div>
        <div class="time" id="clock"></div>
    </div>

    <div class="bottom-actions">
        <div class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C11.45 2 11 2.45 11 3V4H8C6.9 4 6 4.9 6 6V8.5L8.5 12V20C8.5 21.1 9.4 22 10.5 22H13.5C14.6 22 15.5 21.1 15.5 20V12L18 8.5V6C18 4.9 17.1 4 16 4H13V3C13 2.45 12.55 2 12 2ZM12 6C12.55 6 13 6.45 13 7S12.55 8 12 8 11 7.55 11 7 11.45 6 12 6ZM10 10H14V11.2L12.7 13H11.3L10 11.2V10Z"/>
            </svg>
        </div>
        <div class="action-btn">
            <svg viewBox="0 0 24 24">
                <path d="M12 10.5C10.07 10.5 8.5 12.07 8.5 14C8.5 15.93 10.07 17.5 12 17.5C13.93 17.5 15.5 15.93 15.5 14C15.5 12.07 13.93 10.5 12 10.5ZM12 16C10.9 16 10 15.1 10 14C10 12.9 10.9 12 12 12C13.1 12 14 12.9 14 14C14 15.1 13.1 16 12 16ZM18 7H15.83L14.42 5.46C14.16 5.18 13.78 5 13.39 5H10.61C10.22 5 9.84 5.18 9.58 5.46L8.17 7H6C4.9 7 4 7.9 4 9V17C4 18.1 4.9 19 6 19H18C19.1 19 20 18.1 20 17V9C20 7.9 19.1 7 18 7Z"/>
            </svg>
        </div>
    </div>

    <div class="home-indicator"></div>

    <script>
        let isShifted = true;

        function updateClock() {
            const now = new Date();
            
            if (isShifted) {
                now.setHours(now.getHours() + 1);
            }

            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            const dayNames = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const monthNames = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            
            const dayName = dayNames[now.getDay()];
            const dayNum = now.getDate();
            const monthName = monthNames[now.getMonth()];

            document.getElementById('date').textContent = `${dayName} ${dayNum} ${monthName}`;
        }

        document.getElementById('secret-trigger').addEventListener('click', () => {
            isShifted = !isShifted;
            updateClock();

            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        });

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
